[project]
name = "wheel-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.20.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "langgraph-checkpoint-sqlite",
    "apscheduler>=3.10,<4",
    "pytz>=2024.1",
]

[project.scripts]
wheel-bot = "scheduler:main"

[tool.pytest.ini_options]
python_files = ["tests/test_*.py"]
